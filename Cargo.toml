[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
rust-version = "1.98.0"

[workspace.dependencies]
base64 = { version = "0.23.1" }
chrono = "0.4.45"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
uuid = "1.25.0"

[patch.crates-io]
ntfs = { git = "https://github.com/BellezaEmporium/ntfs.git", rev = "c783516a1240a3e1aa9cc113df07c85251195bf6" }
