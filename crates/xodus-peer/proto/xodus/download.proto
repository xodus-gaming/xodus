syntax = "proto3";

package xodus.download;

enum DownloadServiceMessage {
    DOWNLOAD_SERVICE_MESSAGE_UNDEFINED = 0;
    DOWNLOAD_SERVICE_MESSAGE_GET_PROGRESS = 1;
}

message ProgressRequest {
    string id = 1;
}

message ProgressResponse {
    uint64 total = 1;
    uint64 downloaded = 2;
}

service DownloadService {
    rpc GetProgress(ProgressRequest) returns (ProgressResponse);
}