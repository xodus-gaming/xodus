[package]
name = "xodus"
version = "0.1.0"
edition = "2024"

[dependencies]
xal = { git = "https://github.com/xodus-gaming/xal-rs", rev = "6aa2420f8f0d5e6f7460ff13f399037583a942f4", version = "0.1.3" }
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
quick-xml = { version = "0.41.0", features = ["serialize", "overlapped-lists"] }
log = "0.4.28"
chrono = { workspace = true }
base64 = { workspace = true }
rand = "0.10.2"
uuid = "1.24.0"
aes = "0.9.2"
keyring-core = { version = "1.0.0", features = ["sample"] }
zerocopy = { version = "0.8.55", features = ["derive"] }
bergshamra-c14n = "0.8.0"
hmac = "0.13.0"
bergshamra = "0.8.0"
rsa = { version = "0.9.10", features = ["serde", "sha2"] }
sha2 = "0.11.0"
cbc = "0.2.1"
url = "2.5.8"
aes-keywrap = "0.9.0"
num_enum = "0.7.6"
prost = "0.14.4"
globset = "0.4.19"
thiserror = "2.0.19"
num-bigint-dig = "0.9.1"
num-integer = "0.1.46"
kryptering = "0.5.0"

[target.'cfg(not(target_os = "linux"))'.dependencies]
smbios-lib = "0.9.4"

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = { version = "1.0.0", features = ["crypto-openssl"]}

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.0", features = ["keychain"]}

[dev-dependencies]
rsa = "0.9.10"
bergshamra = "0.8.0"
ed25519-dalek = "3.0.0"

[build-dependencies]
prost-build = "0.14.4"

[features]
key-chain-file = []
