[package]
name = "xodus"
version = "0.1.0"
edition = "2024"
rust-version = { workspace = true }

[dependencies]
xal = { git = "https://github.com/xodus-gaming/xal-rs", rev = "79b9932e5266a1a087a81e7e015ae9460b72a173", version = "0.1.3" }
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }
uuid = { workspace = true }
serde_json = "1.0.154"
quick-xml = { version = "0.42.0", features = ["serialize", "overlapped-lists"] }
rand = "0.10.4"
aes = "0.9.4"
keyring-core = { version = "1.1.0", features = ["sample"] }
zerocopy = { version = "0.8.64", features = ["derive"] }
bergshamra-c14n = "0.12.0"
hmac = "0.13.0"
bergshamra = "0.12.0"
rsa = "0.10.0"
sha2 = "0.11.1"
cbc = "0.2.1"
url = "2.5.9"
aes-keywrap = "0.9.1"
num_enum = "0.7.6"
prost = "0.14.6"
globset = "0.4.21"
kryptering = "0.7.1"

[target.'cfg(not(target_os = "linux"))'.dependencies]
smbios-lib = "0.9.4"

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-openssl"]}

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"]}

[dev-dependencies]
rsa = "0.10.0"
bergshamra = "0.12.0"
ed25519-dalek = "3.0.0"

[build-dependencies]
prost-build = "0.14.6"

[features]
key-chain-file = []
