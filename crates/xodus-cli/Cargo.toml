[package]
name = "xodus-cli"
version = "0.1.0"
edition = "2024"
default-run = "xodus-cli"

[dependencies]
xodus = { path = "../xodus" }
msixvc = { path = "../msixvc" }
eappx = { git = "https://github.com/tuxuser/eappx-rs" }
base64 = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
console-subscriber = { workspace = true, optional = true }
tao = "0.37.3"
wry = "0.57.3"
async-trait = "0.1.92"
clap = { version = "4.6.9", features = ["derive"] }
serde_json = "1.0.154"
chrono = { workspace = true }
inquire = "0.9.5"
futures-util = "0.3.34"
uuid = "1.29.3"
indicatif = "0.18.6"
fs2 = "0.4.3"
tempfile = "3.27.0"
rustix = { version = "1.1.6", features = ["fs"] }
ctrlc = "3.5.3"
nix = "0.32.0"

[features]
tokio_console = ["dep:console-subscriber"]
