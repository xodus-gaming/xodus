[package]
name = "msixvc"
version = "0.1.0"
edition = "2024"
rust-version = { workspace = true }

[dependencies]
msixvc-common = { path = "../msixvc-common" }

tokio = { workspace = true }
reqwest = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
aes = "0.9.4"
bitflags = "2.13.2"
bytes = "1.12.2"
futures-util = "0.3.34"
gpt = "4.1.0"
ntfs = "0.4.0"
num_enum = "0.7.6"
pin-project = "1.2.0"
sha2 = "0.11.1"
tokio-util = { version = "0.7.20", features = ["io-util"] }
typenum = { version = "1.20.1", features = ["const-generics"] }
zerocopy = { version = "0.8.64", features = ["derive"] }
