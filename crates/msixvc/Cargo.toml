[package]
name = "msixvc"
version = "0.1.0"
edition = "2024"
rust-version = { workspace = true }

[dependencies]
msixvc-common = { path = "../msixvc-common" }

tokio = { workspace = true }
reqwest = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
aes = "0.9.2"
bitflags = "2.13.1"
bytes = "1.12.1"
futures-util = "0.3.34"
gpt = "4.1.0"
ntfs = "0.4.0"
num_enum = "0.7.6"
pin-project = "1.1.13"
sha2 = "0.11.0"
tokio-util = { version = "0.7.19", features = ["io-util"] }
typenum = { version = "1.20.1", features = ["const-generics"] }
zerocopy = { version = "0.8.56", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
ciborium = "0.2.2"
aes-keywrap = "0.9.0"
cbc = "0.2.1"
hmac = "0.13.0"
zip = { version = "9.0.1", default-features = false, features = ["deflate", "deflate-flate2"] }
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
tempfile = "3.27.0"
