[package]
name = "msixvc2"
version = "0.1.0"
edition = "2024"
rust-version = { workspace = true }

[dependencies]
uuid = { workspace = true }
thiserror = { workspace = true }
sha2 = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
ciborium = "0.2.2"
aes = "0.9.2"
aes-keywrap = "0.9.0"
cbc = "0.2.1"
hmac = "0.13.0"
zip = { version = "9.0.1", default-features = false, features = ["deflate", "deflate-flate2"] }
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
tempfile = "3.27.0"
